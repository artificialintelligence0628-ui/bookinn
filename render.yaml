services:
  - type: web
    name: bookinn
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        sync: false # set to your Neon (or Render Postgres) connection string in the Render dashboard
      - key: JWT_SECRET
        sync: false # set your own value in the Render dashboard
      - key: ADMIN_EMAIL
        sync: false # set your own value in the Render dashboard
      - key: ADMIN_PASSWORD
        sync: false # set your own value in the Render dashboard
      - key: PAYSTACK_SECRET_KEY
        sync: false # optional — only needed if you're using Paystack payments
      - key: VITE_PAYSTACK_PUBLIC_KEY
        sync: false # optional — only needed if you're using Paystack payments
      - key: RESEND_API_KEY
        sync: false # set to your Resend API key in the Render dashboard — required for password reset and email verification
